<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Loop Example</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<section style="height:100vh;margin-top:100px;">
	<div class="h4 pb-2 mb-4 text-danger border-bottom border-danger text-center" style="padding-top:30px;">
          ....User Booking Detail....
    </div>
	<table class="table table-sm">
          <thead class="thead-dark">
              <tr>
                 <th scope="col">User Id</th>
		          <th scope="col">User Name</th>
		          <th scope="col">Address</th>
		          <th scope="col">Car Model</th>
		           <th scope="col">Days</th>
		           <th scope="col">Pick Up Locatio</th>
		           <th scope="col">Drop of Location</th>
		           <th scope="col">Contact</th> 
		           <th scope="col">Paid Amount</th> 
		           <th scope="col">License No</th> 
		           <th scope="col">Aadhar No</th>  
             </tr>
          </thead>
          <tbody>
	          <tr th:each="n :${users}">
	            <th scope="row" th:text="${n.id}"></th>
			      <th scope="row" th:text="${n.name}"></th>
			      <td th:text="${n.address}"></td>
			      <td th:text="${n.carModel}"></td>
			      <td th:text="${n.days}"></td>
			      
			      <td th:text="${n.pickUp}"></td>
			      <td th:text="${n.dropUp}"></td>
			      <td th:text="${n.mobNo}"></td>
			      <td th:text="'₹ '+${n.price}"></td>
			      <td th:text="${n.licenseNo}"></td>
			      <td th:text="${n.aadharNo}"></td>
			      
	         </tr>
          </tbody>
      </table>
      </section>
</body>
</html>
