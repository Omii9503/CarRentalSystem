<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Add New Product Page</title>
</head>
<body>
	<section style="height:140vh; margin-top:100px;">
		<div class="container">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<div class="my-card mt-1">

				      <div class="container text-center" style="padding-top:20px;">
				      	<img class="" style="width:80px;" th:src="@{/img/membership.png}"/>
				      </div>
						<h1 class="text-center" style="padding-bottom:20px;">Add New Car Detail !!</h1>
						
						<div th:if="${message}" th:classappend="${message.type}" class="alert" role="alert">
          					<p class="text-center" th:text="${message.content}"></p>
    					</div>
						<form action="" th:action="@{/add-car}" method="post">
								<div class="row g-3">
								  <div class="col">
								   <label class="form-label text-dark">Enter Car Name<span style="color:red">*</span></label>
								    <input type="text" class="form-control"  placeholder="Enter Car Name" aria-label="First name" name="carName" required>
								  </div>
								  <div class="col">
								    <label  class="form-label text-dark">Select Car Category<span style="color:red">*</span></label>
								    <select id="inputState" class="form-select" name="category">
								      <option selected>Choose...</option>
								      <option>Luxury</option>
								      <option>Sedan</option>
								      <option>SUV</option>
								      <option>Electric vehicle</option>
								    </select>
								  </div>
							 </div>
							 
							 <div class="row g-3 mt-1">
								  <div class="col" >
								   <label  class="form-label text-dark">Enter Car Rent Price<span style="color:red">*</span></label>
								    <input type="number" class="form-control" placeholder="Enter Car Rent Price" aria-label="First name" name="price" required>
								  </div>
								  <div class="col">
								    <label  class="form-label text-dark">Enter No of Seats<span style="color:red">*</span></label>
								    <input type="number" class="form-control" placeholder="Enter No of Seats" aria-label="Last name" name="seat" required>
								  </div>
							 </div>
							 <div class="row g-3 mt-1">
								  <div class="col">
								    <label  class="form-label text-dark">Select Car Transmission[Auto/Manual]<span style="color:red">*</span></label>
								    <select id="inputState" class="form-select" name="transmission">
								      <option selected>Choose...</option>
								      <option>A</option>
								      <option>M</option>
								    </select>
								  </div>
								  <div class="col">
								    <label  class="form-label text-dark">Enter No of Doors<span style="color:red">*</span></label>
								    <input type="number" class="form-control" placeholder="Number of Doors" aria-label="Last name" name="door" required>
								  </div>
							 </div>
							 <div class="row g-3 mt-1">
								  <div class="col">
								   <label  class="form-label text-dark">Enter Car Image URL<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car Image Url" aria-label="First name" name="img" required>
								  </div>
								  <div class="col">
								    <label  class="form-label text-dark">Select Car AC or NonAC<span style="color:red">*</span></label>
								    <select id="inputState" class="form-select" name="ac">
								      <option selected>Choose...</option>
								      <option>A/C</option>
								      <option>Non A/C</option>
								    </select>
								  </div>
							 </div>
							 
							  <div class="row g-3 mt-1">
								  <div class="col">
								   <label  class="form-label text-dark">Enter Car Color<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car Color" aria-label="First name" name="color" required>
								  </div>
								  <div class="col">
								    <label  class="form-label text-dark">Select Car fuel<span style="color:red">*</span></label>
								    <select id="inputState" class="form-select" name="fuel">
								      <option selected>Choose...</option>
								      <option>Petrol</option>
								      <option>Diesel</option>
								    </select>
								  </div>
							 </div>
							 
							 <div class="row g-3 mt-1">
								  <div class="col" >
								   <label  class="form-label text-dark">Enter Car Ground Clearance<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car Ground Clearance" aria-label="First name" name="groundClearance" required>
								  </div>
								  <div class="col">
								    <label  class="form-label text-dark">Enter Car Bootspace<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car Bootspace" aria-label="Last name" name="bootspace" required>
								  </div>
							 </div>
							 
							  <div class="row g-3 mt-1">
								  <div class="col" >
								   <label  class="form-label text-dark">Enter Car Torque<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car Torque" aria-label="First name" name="torque" required>
								  </div>
								  <div class="col">
								    <label  class="form-label text-dark">Enter Car Engine Details<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car Engine Details" aria-label="Last name" name="engine" required>
								  </div>
							 </div>
							 
							   <div class="row g-3 mt-1">
								  <div class="col" >
								   <label  class="form-label text-dark">Enter Car 1st Image<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car 1st Image" aria-label="First name" name="cimage1" required>
								  </div>
								  <div class="col">
								    <label  class="form-label text-dark">Enter Car 2nd Image<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car 2nd Image" aria-label="Last name" name="cimage2" required>
								  </div>
							 </div>
							 
							 <div class="row g-3 mt-1">
								  <div class="col" >
								   <label  class="form-label text-dark">Enter Car 3rd Image<span style="color:red">*</span></label>
								    <input type="text" class="form-control" placeholder="Enter Car 3rd Image" aria-label="First name" name="cimage3" required>
								  </div>
								  
							 </div>
							
							 <div class="form-group form-check">
								<input type="checkbox" name="agreement" class="form-check-input" id="agreement"/>
								<label for="agreement">Accept terms and conditions</label>
							</div>
							 
							 <div class="container text-center">
							 	<button type="submit"  class="btn bg-primary text-white">
							 		Add Car
							 	</button>
							 	<button type="reset" class="btn btn-warning text-white">
							 		Reset
							 	</button>
							 </div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
