<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Loop Example</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<section style="height:100vh;margin-top:100px;">
	<div class="h4 pb-2 mb-4 text-danger border-bottom border-danger text-center" style="padding-top:30px;">
          ....All Cars Data....
    </div>
	<table class="table table-sm">

          <thead class="thead-dark">
              <tr>
		          <th scope="col">Car Name</th>
		          <th scope="col">Car Price</th>
		          <th scope="col">Car Seat</th>
		          <th scope="col">No of Door</th>
		           <th scope="col">Transmission</th>
		           <th scope="col">A/C or Non A/C</th>
		           <th scope="col">Category</th>
		           <th scope="col">Fuel</th> 
		           <th scope="col">Color</th> 
		           <th scope="col">Ground Clearance</th> 
		           <th scope="col">BootSpace</th> 
		           <th scope="col">Torque</th>  
		           <th scope="col">Engine</th>   
             </tr>
          </thead>
          <tbody>
	          <tr th:each="n :${allcars}">
			      <th scope="row" th:text="${n.carName}"></th>
			      <td th:text="'₹ '+${n.price}"></td>
			      <td th:text="${n.seat}"></td>
			      <td th:text="${n.door}"></td>
			      <td th:text="${n.transmission}"></td>
			      <td th:text="${n.ac}"></td>
			      <td th:text="${n.category}"></td>
			      
			      <td th:text="${n.fuel}"></td>
			      <td th:text="${n.color}"></td>
			      <td th:text="${n.groundClearance}"></td>
			      <td th:text="${n.bootspace}"></td>
			      <td th:text="${n.torque}"></td>
			      <td th:text="${n.engine}"></td>
	         </tr>
          </tbody>
      </table>
      </section>
</body>
</html>
