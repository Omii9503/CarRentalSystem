<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
<!-- Include SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <section style="height:90vh; margin-top:80px;">
        <!-- This is carousel section -->
        <div id="carouselExampleRide" class="carousel slide" data-bs-ride="true">
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="1000">
                    <img src="..." th:src="@{/img/chevrolet2.jpg}" class="d-block w-100" alt="..." style="height:90vh;">
                    <div class="carousel-caption d-none d-md-block" style="bottom: 550px;">
                     <!-- Trigger JavaScript Alert if updateSuccess is present -->
				   <script th:if="${updateSuccess}">
        Swal.fire({
            title: "Success!",
            text: "Car has been updated successfully!",
            icon: "success",
            timer: 3000,  // Auto-close after 3 seconds
            showConfirmButton: false
        });
    </script>
                        <a href="addcar" style="margin-right:50px">
                            <button type="button" class="btn btn-warning" style="font-weight:600;padding:13px;">Add Cars</button>
                        </a>
                        <a href="updatecar" style="margin-right:50px">
                            <button type="button" class="btn btn-warning" style="font-weight:600;padding:13px;">Update Car Detail</button>
                        </a>
                        <a href="deletecar" style="margin-right:50px">
                            <button type="button" class="btn btn-warning" style="font-weight:600;padding:13px;">Delete Car</button>
                        </a>
                        <a href="get-cars-data" style="margin-right:50px">
                            <button type="button" class="btn btn-warning" style="font-weight:600;padding:13px;">Get All Cars Details</button>
                        </a>
                        <a onclick="logout()">
                            <img src="..." th:src="@{/img/logout.png}" style="height:5vh;" alt="...">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
