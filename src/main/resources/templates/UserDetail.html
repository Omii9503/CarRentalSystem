<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Loop Example</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<section style="height:100vh;margin-top:90px;">
	<div class="h4 pb-2 mb-4 text-danger border-bottom border-danger text-center" style="padding-top:10px;">
          ....User Details....
    </div>
    
    <form id="bookingForm" th:action="@{/processBooking}" method="post">
	<table class="table text-center w-auto mx-auto">

          <thead class="thead-dark">
              <tr>
		          <th scope="col">User Name : </th>
		          <th scope="col">
                    <input type="text" name="name" th:value="${user.name}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
             <tr>
		          <th scope="col">User Mobile No : </th>
		            <th scope="col">
                    <input type="text" name="mobNo" th:value="${user.mobNo}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
             <tr>
		          <th scope="col">Email Id : </th>
		          <th scope="col">
                    <input type="email" name="email" th:value="${user.email}" readonly style="border: none; outline: none; background: transparent;width:220px"/>
                </th>
             </tr>
             <tr>
		          <th scope="col">Aadhar Number : </th>
		        <th scope="col">
                    <input type="text" name="aadharNo" th:value="${user.aadharNo}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
              <tr>
		          <th scope="col">License Number : </th>
		            <th scope="col">
                    <input type="text" name="licenseNo" th:value="${user.licenseNo}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
		      
             </tr>
              <tr>
		          <th scope="col">Address : </th>
		            <th scope="col">
                    <input type="text" name="address" th:value="${user.address}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
              <tr>
		          <th scope="col">State : </th>
		           <th scope="col">
                    <input type="text" name="state" th:value="${user.state}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
             
             <tr>
		          <th scope="col">Car Model Name : </th>
		           <th scope="col">
                    <input type="text" name="carModel" th:value="${user.carModel}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
           
              <tr>
		          <th scope="col">Pickup Location : </th>
		          <th scope="col">
                    <input type="text" name="pickUp" th:value="${user.pickUp}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
               <tr>
		          <th scope="col">Dropup Location : </th>
		          <th scope="col">
                    <input type="text" name="dropUp" th:value="${user.dropUp}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
               <tr>
		          <th scope="col">Days : </th>
		          <th scope="col">
                    <input type="number" name="days" th:value="${user.days}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
              <tr>
		          <th scope="col">Total Amount : </th>
		          <th>
		         ₹ <input type="text" name="price" th:value="${user.price}*${user.days}" id="payment_field" readonly style="border: none; outline: none; background: transparent;">
		          </th>
		          
             </tr>
             <tr>
		          <th scope="col">Query : </th>
		          <th scope="col">
                    <input type="text" name="query" th:value="${user.query}" readonly style="border: none; outline: none; background: transparent;"/>
                </th>
             </tr>
             
             <tr>
             <th>
             <button type="button" class="btn btn-primary" onclick="paymentStart()">Procced To Payment</button>
             </th>
             <th>
             <button type="reset" class="btn btn-danger">Cancel</button>
             </th>
             </tr>
          </thead>
      </table>
      
      </form>
      </section>
</body>
</html>
